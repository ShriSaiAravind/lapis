<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>Lapis</span>
      </div>
      <div class="controls">
        <label class="toggle">
          <span>Coder</span>
          <select id="coderSelect">
            <option value="local">Local</option>
            <option value="openrouter">OpenRouter</option>
            <option value="groq">Groq</option>
          </select>
        </label>
        <span class="usage" id="usage">0 in / 0 out</span>
        <button class="btn-ghost" id="pipBtn" title="Picture-in-picture">⧉ PiP</button>
        <button class="btn-ghost" id="clearBtn">Clear</button>
      </div>
    </header>

    <main class="chat" id="chat"></main>

    <form class="composer" id="composer">
      <div class="tools-dropdown">
        <button type="button" class="btn-ghost" id="toolsBtn" title="Choose which tools are active">🛠 Tools</button>
        <div class="tools-panel" id="toolsPanel" hidden>
          <div class="tools-panel-header">Active tool categories</div>
          <div class="tools-panel-list" id="toolsPanelList">
            <!-- populated by app.js from /api/tool-categories -->
          </div>
        </div>
      </div>
      <textarea id="input" placeholder="what we doin??" rows="1" autofocus></textarea>
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
