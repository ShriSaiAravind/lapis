[project]
name = "lapis"
version = "0.1.0"
dependencies = [
    "ollama==0.6.2",
    "openpyxl==3.1.5",
    "python-dotenv==1.2.2",
    "python-docx==1.1.2",
    "pywebview==6.2.1",
    "rich==15.0.0",
    "yt-dlp",
    "win11toast==0.35",
    "requests",
]

[project.optional-dependencies]
ui = ["flask==3.1.0"]

[project.scripts]
lapis = "main:main"

[tool.setuptools]
py-modules = ["main", "agent"]

[tool.setuptools.packages.find]
where = ["."]